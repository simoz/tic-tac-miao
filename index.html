<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tic Tac Miao: Maci e Piumi camminano sulla tastiera. Un gioco per imparare lettere, parole e numeri.">
</head>
<body>
<title>Tic Tac Miao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Come Maci e Piumi: canvas a tutto schermo, pannelli da libro illustrato negli angoli, dialogo in alto (in basso c'è la tastiera) */
:root{
  --ink:#3b2a35; --paper:#fff4dc; --paper-2:#f3dcae; --red:#e5533d; --gold:#ffc93d;
  --leaf:#4caf50; --muted:#8a6f60;
  --display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#4a4252;color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--display);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.quest{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px;max-width:min(330px,calc(100% - 330px));display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;background:var(--red);color:#fff;font-weight:600;font-size:13px;letter-spacing:.08em;padding:2px 10px;border-radius:99px;border:2px solid var(--ink)}
#questText{font-weight:700;font-size:clamp(16px,2.3vw,22px);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
#questProg{display:flex;gap:4px;flex-wrap:wrap}
#questProg svg{width:26px;height:26px}
.party{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:3}
.pc{display:flex;flex-direction:column;align-items:center;padding:4px 6px 6px;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:13px;letter-spacing:.05em;transition:transform .12s}
.pc canvas{width:48px;height:48px}
.pc.on{background:var(--gold);transform:translateY(-2px)}
.pc.mus svg{width:48px;height:48px;padding:8px;box-sizing:border-box}
.pc.mus.on{background:var(--paper-2);transform:none}
.pc.mus.on .x{display:none}
.pc:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.dialog{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(720px,calc(100% - 24px));box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:12px 14px;z-index:4}
.pic{flex:none;width:92px;height:92px;border-radius:50%;background:#bfe3a5;border:3px solid var(--ink);overflow:hidden}
.pic canvas{width:100%;height:100%}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dname{align-self:flex-start;background:var(--gold);border:2px solid var(--ink);border-radius:99px;padding:1px 10px;font-weight:600;font-size:14px;letter-spacing:.06em}
.dtext{font-weight:700;font-size:clamp(20px,3.4vw,30px);line-height:1.15;letter-spacing:.02em}
.dbtns{display:flex;flex-direction:column;gap:8px}
.btn{border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:20px;padding:8px 16px;background:var(--leaf);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper-2);color:var(--ink);padding:6px 10px;display:grid;place-items:center}
.btn.ghost svg{width:26px;height:26px}
.btn small{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;opacity:.9}
body.talking .quest{visibility:hidden}
body:not(.play) .quest,body:not(.play) #bBack{display:none}
body.intro .party .pc:not(.mus){display:none}
/* GIOCA: sotto il titolo che i gatti scrivono sulla tastiera */
#start{position:fixed;left:50%;top:var(--gy,50%);transform:translate(-50%,-50%)}
#bPlay{font-size:34px;padding:10px 40px;background:#f28c28}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,25,45,.35);padding:16px;overflow:auto}
.card{position:relative;text-align:center;padding:30px 24px 22px;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ribbon{position:absolute;top:-18px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 16px;font-weight:700;letter-spacing:.12em;font-size:15px}
.card h1{margin:4px 0 0;font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.02;color:var(--ink)}
.card h1 em{font-style:normal;color:var(--red)}
.card p{margin:0;font-size:17px;color:var(--muted);font-weight:500;max-width:34ch}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:6px}
.lvl{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);text-align:left}
.lvl:not(:disabled):hover{background:var(--gold)}
.lvl:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.levels .lvl:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;min-width:50%}
.lvl:disabled{opacity:.55;cursor:default}
.lvl b{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:#fff8e6;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:22px}
.lvl span{display:flex;flex-direction:column;font-weight:600;font-size:17px;line-height:1.1}
.lvl small{font-size:13px;color:var(--muted);letter-spacing:.06em}
.lvl i{font-style:normal;color:#e08a00;font-size:15px;letter-spacing:.1em}
.card .btn{font-size:24px;padding:10px 30px;background:#f28c28;margin-top:6px}
.card .btn.alt{background:var(--leaf);font-size:20px;padding:8px 24px;margin-top:0}
.song{display:inline-block;margin-top:4px}
.link{background:none;border:0;font-weight:600;font-size:15px;color:var(--muted);text-decoration:underline;padding:4px}
.stars{display:flex;gap:6px}
.stars svg{width:52px;height:52px}
@media (max-width:560px){.pic{width:60px;height:60px}.dialog{gap:10px;padding:10px}.btn{font-size:18px;padding:6px 12px}.pc canvas,.pc.mus svg{width:38px;height:38px}.quest{max-width:calc(100% - 250px)}.party{gap:5px}.levels{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
</style>

<canvas id="game" aria-label="Il gioco: una tastiera e i personaggi"></canvas>

<div class="quest panel" id="quest" aria-live="polite">
  <span class="tag" id="questTag">ZAMPA PICCOLA</span>
  <div id="questText"></div>
  <div id="questProg"></div>
</div>

<div class="party">
  <button class="pc mus" id="bBack" aria-label="Torna alle missioni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>MISSIONI</button>
  <button class="pc on" id="bMaci" aria-label="Gioca con Maci"><canvas width="96" height="96"></canvas>MACI</button>
  <button class="pc" id="bPiumi" aria-label="Gioca con Piumi"><canvas width="96" height="96"></canvas>PIUMI</button>
  <button class="pc mus on" id="bMus" aria-label="Accendi o spegni la musica" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="currentColor"/><circle cx="17.5" cy="16" r="3" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="#e5533d" stroke-width="3" stroke-linecap="round"/></svg>MUSICA</button>
</div>

<div class="dialog panel" id="dlg" hidden>
  <div class="pic"><canvas id="dlgPic" width="184" height="184"></canvas></div>
  <div class="dbody"><span class="dname" id="dName"></span><div class="dtext" id="dText"></div></div>
  <div class="dbtns">
    <button class="btn ghost" id="dSay" aria-label="Ascolta la frase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="btn" id="dOk">OK<small>INVIO ⏎</small></button>
  </div>
</div>

<div id="start"><button class="btn" id="bPlay">&#9654; GIOCA<small>INVIO ⏎</small></button></div>

<div class="overlay" id="menu" hidden>
  <div class="card panel">
    <span class="ribbon">SCEGLI LA MISSIONE</span>
    <h1><em>Tic Tac</em> Miao</h1>
    <p>Premi il numero della missione, oppure toccala.</p>
    <div class="levels" id="levels"></div>
    <a class="link song" href="https://suno.com/song/bed1a931-18e2-4a2d-9fc2-ee12973a0a85" target="_blank" rel="noopener">&#9835; Ascolta la canzone "Tic Tac Miao"</a>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card panel">
    <span class="ribbon">MISSIONE COMPIUTA</span>
    <div class="stars" id="stars"></div>
    <h1>MIAO&#8209;RAVIGLIOSO!</h1>
    <p id="endText"></p>
    <button class="btn" id="again">GIOCA ANCORA<small>INVIO ⏎</small></button>
    <button class="link" id="toMenu">Torna alle missioni</button>
  </div>
</div>

<script>
(()=>{
/* ===== Voci: frasi dei personaggi e parole lette ad alta voce =====
   Frasi: audio/voce/<prefisso><numero>.mp3 nell'ordine delle liste. Le prime frasi di ogni personaggio
   vengono da Maci e Piumi; le altre si generano con ./genera-voci.sh (crea solo i file che mancano).
   Parole (lettere, numeri, sillabe): audio/parole/<parola>.mp3 */
const PREFIX={simone:'o',luisa:'l',emma:'e',giulio:'u',mile:'i'};
const LINES={
  simone:['CIAO MACI!','VAI DALLA ZIA SILVIA.','I MIEI ROBOTTINI SONO SCAPPATI!','MI AIUTI A PRENDERLI?','CORRI, MACI!','I MIEI ROBOTTINI!','GRAZIE MACI!','GUARDA IL COMPUTER!','CIAO PIUMI!','CORRI, PIUMI!','GRAZIE PIUMI!',
    'SONO USCITI DAL COMPUTER.','OGNI ROBOTTINO HA UNA LETTERA.','PREMI LA STESSA LETTERA SULLA TASTIERA!','COSÌ IL ROBOTTINO TORNA A CASA.','BRAVO MACI!','BRAVA PIUMI!',
    'ADESSO IL TASTO NON BRILLA SUBITO!','GUARDA! INSIEME FANNO UNA PAROLA!','IL COMPUTER HA DETTO MIAO!','PREMI INVIO PER ANDARE AVANTI.','CERCA IL TASTO CHE BRILLA!'],
  luisa:['CIAO PIUMI!','NON TROVO I MIEI OCCHIALI.','MI AIUTI A CERCARLI?','CERCA BENE, PIUMI!','I MIEI OCCHIALI!','GRAZIE PIUMI! ORA CI VEDO.','VAI DAL NONNO GIAN.','GIOCA CON MARGHERITA!','VIENI AL TAVOLO!','ECCO TÈ E BISCOTTI!','BRAVA PIUMI!','TUTTI A MERENDA!',
    'CIAO MACI!','CERCA BENE, MACI!','GRAZIE MACI! ORA CI VEDO.','BRAVO MACI!','GRAZIE PIUMI!','GRAZIE MACI!',
    'SONO CADUTI TUTTI I MIEI LIBRI!','OGNI LIBRO HA UNA LETTERA.','PREMI LA LETTERA E IL LIBRO TORNA A POSTO.','ADESSO IL TASTO NON BRILLA SUBITO!','CERCA IL TASTO CHE BRILLA!','ADESSO SCRIVI NONNA!','TUTTI I LIBRI SONO A POSTO!'],
  emma:['CIAO MACI!','CIAO PIUMI!','OGGI È LA FESTA DI MARGHERITA.','TROVA 3 MARGHERITE!','NON HAI ANCORA MARGHERITE.','HAI 1 MARGHERITA.','HAI 2 MARGHERITE.','NE MANCANO 3!','NE MANCANO 2!','NE MANCA 1!','BRAVO! CHE BELLE!','BRAVA! CHE BELLE!','SERVE UN NASTRO.','CERCA SOTTO IL VASO!','IL NASTRO È SOTTO UN VASO.','PROVA TUTTI I VASI!','CORRI!','PORTA I FIORI A MARGHERITA!','MIAO! CHE BELLA FESTA!',
    'FACCIO UNA SCIARPA PER MARGHERITA.','OGNI GOMITOLO HA UNA SILLABA.','SCRIVI LA SILLABA CON DUE TASTI!','BRAVO MACI!','BRAVA PIUMI!','ADESSO IL TASTO NON BRILLA SUBITO!','CERCA IL TASTO CHE BRILLA!','ADESSO LE PAROLE!','LA SCIARPA È PRONTA!','GRAZIE MACI!','GRAZIE PIUMI!'],
  giulio:['CIAO MACI!',"MI AIUTI NELL'ORTO?",'RACCOGLI 3 CAROTE!','CERCA LE FOGLIE GRANDI!','CHE BELLE CAROTE!','GRAZIE MACI!','VAI DALLA ZIA MILE.','TUTTI A TAVOLA!','CIAO PIUMI!','GRAZIE PIUMI!',
    'RACCOGLIAMO LE CAROTE!','CONTA LE CAROTE.','PREMI IL NUMERO GIUSTO!','QUANTE CAROTE?','BRAVO MACI!','BRAVA PIUMI!','ADESSO IL TASTO NON BRILLA SUBITO!','CERCA IL TASTO CHE BRILLA!','ADESSO I POMODORI!','QUANTI POMODORI?','CHE BEL CESTO!'],
  mile:['CIAO MACI!','VAI DALLO ZIO GIULIO.','LE GALLINE SONO SCAPPATE!','RIPORTALE NEL POLLAIO!','CORRI, MACI!','GRAZIE MACI!','PRENDI LE UOVA!','CHE BELLE UOVA!','FACCIAMO LA FRITTATA.','ECCO LA FRITTATA!','BRAVO MACI!','CIAO PIUMI!','CORRI, PIUMI!','GRAZIE PIUMI!','BRAVA PIUMI!',
    'LE GALLINE FANNO LE UOVA.','CONTA TUTTE LE UOVA!','QUANTE UOVA IN TUTTO?','ADESSO IL TASTO NON BRILLA SUBITO!','CERCA IL TASTO CHE BRILLA!','ADESSO TANTE UOVA!']
};
/* le parole lette con la voce "maestra" (lettere, numeri, sillabe, parole delle immagini) */
const NOME={A:'a',B:'bi',C:'ci',D:'di',E:'e',F:'effe',G:'gi',H:'acca',I:'i',J:'i lunga',K:'cappa',L:'elle',M:'emme',N:'enne',O:'o',P:'pi',Q:'cu',R:'erre',S:'esse',T:'ti',U:'u',V:'vu',W:'doppia vu',X:'ics',Y:'ipsilon',Z:'zeta',
  '0':'zero','1':'uno','2':'due','3':'tre','4':'quattro','5':'cinque','6':'sei','7':'sette','8':'otto','9':'nove',SPAZIO:'spazio',INVIO:'invio',CANC:'cancella'};
const FIGURE={M:'mela',P:'palla',L:'luna',T:'tazza',S:'sole',N:'nuvola',R:'rana',D:'dado'};
const SILLABE=[...'MPLTNS'].flatMap(c=>[...'AEIOU'].map(v=>(c+v).toLowerCase()));
const PAROLE=[...new Set([...Object.values(NOME),...Object.entries(FIGURE).map(([k,w])=>NOME[k]+' come '+w),...SILLABE,'mela','luna','sole','nonna','più','fa'])];

/* ===== Motore: schermo, audio, voci, dialoghi, effetti, salvataggi ===== */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const OL='#3b2a35',TAU=Math.PI*2;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* il gioco è disegnato su un foglio di 1000×760: in alto la scena, in basso la tastiera */
const LW=1000,LH=760;
let VW,VH,DPR,Z,OX,OY,EX,EY,T=0;   /* EX, EY: quanto spazio avanza ai lati e sopra, in unità logiche */
function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;
  Z=Math.min(VW/LW,VH/LH);OX=(VW-LW*Z)/2;OY=(VH-LH*Z)/2;EX=OX/Z;EY=OY/Z;
  document.documentElement.style.setProperty('--gy',(OY+250*Z)+'px');}
addEventListener('resize',resize);resize();
const toLogic=(cx,cy)=>({x:(cx-OX)/Z,y:(cy-OY)/Z});

/* ---------- salvataggio ---------- */
const SAVE={cur:'maci',stelle:{},zampa:{},lettere:{}};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('ticTacMiao')||'{}'));}catch(e){}
function save(){try{localStorage.setItem('ticTacMiao',JSON.stringify(SAVE));}catch(e){}}
/* per la cesta dei tesori: quante volte ogni lettera è stata giusta o sbagliata */
function segna(k,ok){const s=SAVE.lettere[k]||(SAVE.lettere[k]={ok:0,no:0});ok?s.ok++:s.no++;save();}

/* ---------- audio ---------- */
let AC=null;
function unlockAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();}
function tone(f,d,delay,type,vol){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;const t0=AC.currentTime+(delay||0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.18,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.05);}catch(e){}}
/* il motivo "tic-tac-miao": due tic e un miao che sale, ritorna in tutto il gioco */
const sfx={
  tic:()=>tone(1500,.04,0,'square',.06),
  ok:()=>{tone(660,.12);tone(880,.12,.07);tone(1320,.2,.14);},
  boop:()=>tone(240,.14,0,'sine',.14),
  meow:()=>{tone(700,.1,0,'sine');tone(520,.2,.08,'sine');},
  motivo:()=>{tone(1320,.05,0,'square',.08);tone(990,.05,.16,'square',.08);tone(660,.12,.34,'sine');tone(880,.25,.42,'sine');},
  win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,i*.11)),
  zap:()=>{for(let i=0;i<6;i++)tone(500+i*160,.07,i*.04,'square',.07);}
};
const music=new Audio();music.loop=true;music.preload='auto';
const VOL=.3;music.volume=VOL;
let musicOn=true;try{musicOn=localStorage.getItem('ticTacMiaoMusica')!=='no';}catch(e){}
function playMusic(src){if(src&&!music.src.endsWith(src)){music.src=src;}if(musicOn)music.play().catch(()=>{});}
function setMusic(on){musicOn=on;try{localStorage.setItem('ticTacMiaoMusica',on?'si':'no');}catch(e){}
  const b=document.getElementById('bMus');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);
  if(on)music.play().catch(()=>{});else music.pause();}

/* ---------- voci ---------- */
let voices=[],chosen=null;
function voiceScore(v){const n=v.name.toLowerCase();let s=0;
  if(/natural|neural|online/.test(n))s+=50;if(/premium/.test(n))s+=45;if(/enhanced|migliorat/.test(n))s+=35;if(/google/.test(n))s+=30;
  if(/alice|federica|elsa|isabella|paola|emma|silvia|giulia/.test(n))s+=8;
  if(/compact|espeak/.test(n))s-=40;if(v.localService===false)s+=5;return s;}
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^it/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));}catch(e){voices=[];}chosen=voices[0]||null;}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
const VOX={emma:{pitch:.95,rate:.82},luisa:{pitch:.95,rate:.85},giulio:{pitch:.8,rate:.9},mile:{pitch:1.05,rate:.9},girl:{pitch:1.3,rate:.95},simone:{pitch:.9,rate:.92},lettere:{pitch:1.1,rate:.8},cat:{pitch:1.15,rate:.9}};
let clip=null,voice=true;
function stopVoice(){try{speechSynthesis.cancel();}catch(e){}if(clip){clip.pause();clip=null;}}
function playClip(src,fallback){clip=new Audio(src);clip.play().catch(fallback);clip.onerror=fallback;}
function say(t,who){if(!voice)return;stopVoice();
  const k=(LINES[who]||[]).indexOf(t);
  if(k>=0){playClip('audio/voce/'+PREFIX[who]+String(k+1).padStart(2,'0')+'.mp3',()=>ttsSay(t,who));return;}
  ttsSay(t,who);}
/* parole, lettere e numeri con la voce "maestra" */
const PAROLE_SET=new Set(PAROLE);
const slug=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function sayWord(t){if(!voice||!t)return;stopVoice();
  if(PAROLE_SET.has(t))playClip('audio/parole/'+slug(t)+'.mp3',()=>ttsSay(t,'lettere'));else ttsSay(t,'lettere');}
const sayKey=id=>sayWord(NOME[id]);
/* più parole una dopo l'altra (per contare: uno, due, tre...) */
let sayTimers=[];
function sayList(list,gap){sayTimers.forEach(clearTimeout);sayTimers=list.map((t,i)=>setTimeout(()=>sayWord(t),i*(gap||650)));}
function ttsSay(t,who){try{speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.toLowerCase().replace(/!/g,'! ').replace(/\./g,'. '));u.lang='it-IT';if(chosen)u.voice=chosen;
  const p=VOX[who]||VOX.cat;u.pitch=p.pitch;u.rate=p.rate;speechSynthesis.speak(u);}catch(e){}}

/* ---------- dialoghi (OK si preme anche con INVIO) ---------- */
const NAMES={emma:'EMMA',girl:'MARGHERITA',simone:'ZIO SIMONE',luisa:'NONNA LUISA',giulio:'ZIO GIULIO',mile:'ZIA MILE'};
const PORTRAIT={
  emma:p=>{p.setTransform(2.6,0,0,2.6,0,0);drawCat(p,30,74,CATS.emma,{sit:true,f:1,t:0,noShadow:true});},
  girl:p=>{p.setTransform(2.4,0,0,2.4,0,0);drawGirl(p,38,148,{t:0,noShadow:true});},
  simone:p=>{p.setTransform(2.2,0,0,2.2,0,0);drawPerson(p,42,145,{kind:'simone',noShadow:true});},

let floats=[],parts=[];
function floatText(x,y,txt,col,size){floats.push({x,y,txt,t:0,col:col||'#fff',size:size||34});}
function burst(x,y,n,cols){for(let i=0;i<(RM?Math.ceil(n/4):n);i++){const a=R()*TAU,s=60+R()*160;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,life:1+R()*.6,col:cols[i%cols.length],r:3+R()*4,rot:R()*6});}}
const confetti=(x,y)=>burst(x,y,90,['#ff6fa8','#ffc93d','#5cbf60','#6a8ff0','#fff']);
function fxUpdate(dt){
  floats.forEach(f=>f.t+=dt);floats=floats.filter(f=>f.t<1.6);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt;p.rot+=dt*6;});parts=parts.filter(p=>p.life>0);
}
function fxDraw(c){
  parts.forEach(p=>{c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=Math.min(1,p.life*2);c.fillStyle=p.col;c.fillRect(-p.r,-p.r/2,p.r*2,p.r);c.restore();});
  floats.forEach(f=>{const a=f.t<1.2?1:1-(f.t-1.2)/.4,y=f.y-f.t*40;c.save();c.globalAlpha=a;c.font=`700 ${f.size}px Fredoka, system-ui, sans-serif`;c.textAlign='center';c.textBaseline='middle';
    c.lineWidth=7;c.strokeStyle=OL;c.lineJoin='round';c.strokeText(f.txt,f.x,y);c.fillStyle=f.col;c.fillText(f.txt,f.x,y);c.restore();});
}

function drawCat(c,x,y,cat,o){

  c.strokeStyle=OL;c.lineWidth=tw+6;c.stroke();c.strokeStyle=cat.body;c.lineWidth=tw;c.stroke();
  if(cat.kind=='piumi'){c.strokeStyle='#c4b9ad';c.lineWidth=3;c.stroke();}
  if(cat.kind=='emma'){C(c,tx,ty,tw/2+1);c.fillStyle='#1e1b20';c.fill();}
  if(!o.sit){const ph=mv&&!RM?Math.sin(t*12):0;
    [[-11,ph],[11,-ph],[-4,-ph],[14,ph]].forEach(([lx,p],i)=>{const ox=lx+p*4;rr(c,ox-5,-16,10,15,5);fs(c,i<2?shade(cat.body):cat.body,2.5);
      if(cat.kind!='piumi'){E(c,ox,-3,5,3);c.fillStyle='#fff';c.fill();}});}
  if(o.sit)E(c,0,-20,18,20);else E(c,0,-17-bob*.3,20,14);
  c.fillStyle=cat.body;c.fill();
  c.save();c.clip();
  if(o.sit)E(c,5,-15,10,14);else E(c,9,-14,9,9);c.fillStyle=cat.belly;c.fill();
  if(cat.kind=='emma'){c.strokeStyle='#4a3626';c.lineWidth=3;for(let i=-16;i<12;i+=7){c.beginPath();c.moveTo(i,-40);c.lineTo(i-3,-22);c.stroke();}}
  if(cat.kind=='piumi'){c.strokeStyle='#8c8176';c.lineWidth=2;for(let i=-14;i<10;i+=6){c.beginPath();c.moveTo(i,-6);c.lineTo(i+3,-12);c.stroke();}}
  c.restore();
  if(o.sit)E(c,0,-20,18,20);else E(c,0,-17-bob*.3,20,14);c.lineWidth=3;c.strokeStyle=OL;c.stroke();
  if(o.sit){[[-6],[8]].forEach(([px])=>{E(c,px,-3,6,4);fs(c,cat.kind=='piumi'?cat.body:'#fff',2.5);});}
  const hx=6,hy=(o.sit?-46:-40)-bob;
  [[-16,-6,-12,-28,-2,-15],[4,-15,14,-28,18,-6]].forEach(a=>{c.beginPath();c.moveTo(hx+a[0],hy+a[1]);c.lineTo(hx+a[2],hy+a[3]);c.lineTo(hx+a[4],hy+a[5]);c.closePath();fs(c,cat.body);
    c.beginPath();c.moveTo(hx+a[0]*.6+a[2]*.4,hy+a[1]*.6+a[3]*.4+3);c.lineTo(hx+a[2]*.85+a[4]*.15,hy+a[3]+6);c.lineTo(hx+a[4]*.6+a[2]*.4,hy+a[5]*.6+a[3]*.4+3);c.closePath();c.fillStyle=cat.ear;c.fill();});
  if(cat.kind=='piumi'){[[-1,1],[1,1]].forEach(([d])=>{c.beginPath();const bx=hx+d*16;c.moveTo(bx,hy-2);c.lineTo(bx+d*10,hy+4);c.lineTo(bx+d*2,hy+6);c.lineTo(bx+d*8,hy+11);c.lineTo(bx-d*2,hy+12);c.closePath();fs(c,cat.body,2.5);});}
  C(c,hx,hy,18);c.fillStyle=cat.body;c.fill();
  c.save();C(c,hx,hy,18);c.clip();
  if(cat.kind=='maci'){c.beginPath();c.moveTo(hx+2,hy-19);c.lineTo(hx+7,hy+2);c.lineTo(hx-2,hy+2);c.closePath();c.fillStyle='#fff';c.fill();}

  if(cat.kind!='maci'){c.strokeStyle=cat.kind=='emma'?'#4a3626':'#7d7266';c.lineWidth=2.5;[-4,1,6].forEach(d=>{c.beginPath();c.moveTo(hx+d,hy-17);c.lineTo(hx+d*.7,hy-10);c.stroke();});}
  if(cat.kind=='emma'){c.strokeStyle='#4a3626';c.lineWidth=2.5;[[-18,0],[-18,5],[18,0],[18,5]].forEach(([dx,dy])=>{c.beginPath();c.moveTo(hx+dx,hy+dy);c.lineTo(hx+dx*.75,hy+dy);c.stroke();});}

  c.strokeStyle=cat.kind=='maci'?'#e8e8e8':'rgba(255,255,255,.9)';c.lineWidth=1.2;

  c.restore();
}

/* ===== Tastiera italiana disegnata: tasti colorati per dito, zampette su F e J ===== */
const KU=57,KG=4;   /* lato di un tasto e spazio fra i tasti (unità logiche) */
const KB={x:(LW-14.7*KU)/2,y:440};
/* colori delle dita: uguali per la stessa dita delle due mani, l'indice destro è viola per distinguerlo */
const DITA={mignolo:'#f9b4c8',anulare:'#ffd978',medio:'#a8e08f',indiceS:'#9fd0ff',indiceD:'#cfb3f5',pollice:'#ffbe85'};
const DITO_DI={};
[['mignolo','1QAZ0\'ÌPÈ+ÒÀÙ-'],['anulare','2WSX9OL.'],['medio','3EDC8IK,'],['indiceS','45RTFGVB'],['indiceD','67YUHJNM']].forEach(([d,s])=>[...s].forEach(k=>DITO_DI[k]=d));
DITO_DI.CANC=DITO_DI.INVIO='mignolo';DITO_DI.SPAZIO='pollice';

const KEYS={},KLIST=[];
function addKey(id,x,y,w,h){const k={id,x:KB.x+x*KU,y:KB.y+y*KU,w:w*KU-KG,h:h*KU-KG,press:0,shake:0};KEYS[id]=k;KLIST.push(k);}
[[0,0,[...'1234567890'],"'",'Ì'],[.5,1,[...'QWERTYUIOP'],'È','+'],[.8,2,[...'ASDFGHJKL'],'Ò','À','Ù'],[1.3,3,[...'ZXCVBNM'],',','.','-']].forEach(([x0,row,...rest])=>{
  rest.flat().forEach((id,i)=>addKey(id,x0+i,row,1,1));});
addKey('CANC',12,0,2.7,1);
addKey('INVIO',12.8,1,1.9,2);
addKey('SPAZIO',3.6,4,6.2,1);
const LABEL={CANC:'⌫ CANCELLA',INVIO:'INVIO ⏎',SPAZIO:''};

/* dal tasto premuto sulla tastiera vera al nome del tasto disegnato */
function keyId(e){
  if(e.key=='Enter')return 'INVIO';if(e.key=='Backspace'||e.key=='Delete')return 'CANC';if(e.key==' ')return 'SPAZIO';
  if(e.key&&e.key.length==1){const k=e.key.toUpperCase();if(KEYS[k])return k;}
  const m=/^(Key|Digit)(.)$/.exec(e.code||'');if(m&&KEYS[m[2]])return m[2];
  return null;
}
function keyAt(x,y){return KLIST.find(k=>x>=k.x&&x<=k.x+k.w&&y>=k.y&&y<=k.y+k.h)||null;}
function keyCenter(id){const k=KEYS[id];return {x:k.x+k.w/2,y:k.y+k.h/2};}
function kbUpdate(dt){KLIST.forEach(k=>{k.press=Math.max(0,k.press-dt*5);k.shake=Math.max(0,k.shake-dt*2.5);});}

function zampetta(c,x,y,s,col){c.fillStyle=col;E(c,x,y+s*.35,s*.55,s*.42);c.fill();
  [[-.55,-.2],[-.2,-.55],[.2,-.55],[.55,-.2]].forEach(([a,b])=>{E(c,x+a*s,y+b*s,s*.2,s*.24);c.fill();});}

/* o.target: tasto (o tasti) da premere; o.glow: quanto si vede l'aiuto (0..1); o.colors: colori delle dita */
function drawKeyboard(c,o){
  o=o||{};const tg=[].concat(o.target||[]),glow=o.glow==null?1:o.glow,colors=o.colors!==false;
  rr(c,KB.x-16,KB.y-16,14.7*KU+28,5*KU+28,22);fs(c,'#4a4252',3.5);
  rr(c,KB.x-8,KB.y-8,14.7*KU+12,5*KU+12,16);c.fillStyle='#3b3540';c.fill();
  const pulse=RM?.6:.5+.5*Math.sin(T*6);
  KLIST.forEach(k=>{
    const on=tg.includes(k.id)&&glow>0,dn=k.press*4,sx=k.shake?Math.sin(k.shake*40)*k.shake*5:0;
    const lift=on&&!RM?-3*pulse*glow:0;
    const x=k.x+sx,y=k.y+dn+lift,col=colors?DITA[DITO_DI[k.id]]||'#e8e2d6':'#efe8dc';
    rr(c,x,y+5,k.w,k.h,9);c.fillStyle='#231f27';c.fill();
    if(on){c.save();c.shadowColor='#ffd23d';c.shadowBlur=22*glow*(.5+pulse*.5);rr(c,x-3,y-3,k.w+6,k.h+6,11);c.fillStyle='rgba(255,210,61,'+(.6*glow)+')';c.fill();c.restore();}
    rr(c,x,y,k.w,k.h,9);c.fillStyle=on&&glow>.5?'#fff3b0':col;c.fill();c.lineWidth=on?3.5:2.2;c.strokeStyle=on?'#e08a00':OL;c.stroke();
    rr(c,x+4,y+3,k.w-8,k.h*.36,6);c.fillStyle='rgba(255,255,255,.35)';c.fill();
    const lab=LABEL[k.id]!=null?LABEL[k.id]:k.id;
    c.fillStyle=OL;c.textAlign='center';c.textBaseline='middle';
    c.font=`700 ${lab.length>1?17:27}px Fredoka, system-ui, sans-serif`;
    c.fillText(lab,x+k.w/2,y+k.h/2+(k.id=='F'||k.id=='J'?-5:1));
    if(k.id=='F'||k.id=='J')zampetta(c,x+k.w/2,y+k.h-11,7,'rgba(59,42,53,.55)');
    if(k.id=='SPAZIO'){zampetta(c,x+k.w/2-24,y+k.h/2,8,'rgba(59,42,53,.35)');zampetta(c,x+k.w/2+24,y+k.h/2,8,'rgba(59,42,53,.35)');}
  });
}

/* ===== Il giro comune delle missioni 2–5 =====
   Una missione ha tre turni; ogni turno è una serie di prove; ogni prova chiede una sequenza di tasti
   (una lettera "M", una sillaba "MA", una parola "NONNA", un numero "5").
   La missione disegna la scena e decide cosa succede; qui si contano errori, aiuti, zampe e stelle. */
const HINT_DELAY=[0,2.5,5];   /* dopo quanti secondi brilla il tasto: zampa piccola, media, grande */
function makeQuiz(o){
  /* o: {index,who,name,sub,music,intro(),rounds:[()=>prove],between(r)→frasi,ending()→frasi,endText,
         quest(r),icon(on),show(p)→secondi,prompt(p),step(p,i),good(p)→secondi,bad(p,id),help(p),update(dt),draw(c)} */
  const Q={timers:[]};
  const after=(sec,fn)=>Q.timers.push({t:sec,fn});
  const cur=()=>Q.prove&&Q.prove[Q.pi];
  function hud(){setQuest(o.quest(Q.round),ZAMPE[Q.zampa]);setProg(Q.prove?Q.prove.map((p,i)=>o.icon(i<Q.pi||(i==Q.pi&&p.done))).join(''):'');}
  function startRound(r){Q.round=r;Q.rErr=0;Q.prove=o.rounds[r]();Q.pi=0;hud();showProva();}
  function showProva(){const p=cur();p.pos=0;p.err=0;p.done=false;Q.wt=0;Q.busy=true;
    after(o.show(p)||.8,()=>{Q.busy=false;Q.wt=0;o.prompt(p);});}
  function key(id){
    const p=cur();if(!p||Q.busy)return;
    const want=p.keys[p.pos];
    if(id==want){segna(want,true);p.pos++;sfx.ok();
      if(p.pos<p.keys.length){Q.wt=0;o.step(p,p.pos,id);return;}
      p.done=true;Q.busy=true;hud();const d=o.good(p);
      after(d==null?1:d,()=>{Q.pi++;if(Q.pi<Q.prove.length)showProva();else{Q.prove=null;hud();after(.4,endRound);}});
    }else{
      if(KEYS[id])KEYS[id].shake=1;sfx.boop();p.err++;Q.rErr++;Q.err++;segna(want,false);
      o.bad(p,id);
      if(p.err==2){floatText(QCAT.x+10,QCAT.y-110,'MIAO?','#fff',30);after(.4,()=>o.help(p));}
    }
  }
  function endRound(){
    const r=Q.round,pages=[`${BRAV()} ${N()}!`];
    if(r<o.rounds.length-1){
      if(Q.rErr<=1&&Q.zampa<2){Q.zampa++;pages.push('ADESSO IL TASTO NON BRILLA SUBITO!');}
      else if(Q.rErr>=5&&Q.zampa>0){Q.zampa--;pages.push('CERCA IL TASTO CHE BRILLA!');}
      openDialog(o.who,pages.concat(o.between(r)),()=>startRound(r+1));
    }else{
      openDialog(o.who,o.ending(),()=>{
        sfx.win();confetti(500,200);
        const stelle=Q.err<=2?3:Q.err<=6?2:1;
        SAVE.stelle[o.index]=Math.max(SAVE.stelle[o.index]||0,stelle);SAVE.zampa[o.index]=Q.zampa;save();
        after(1.4,()=>showEnd(stelle,o.endText));
      });
    }
  }
  const mission={name:o.name,sub:o.sub,who:o.who,ready:true,music:o.music,index:o.index,
    start(){Q.timers=[];Q.zampa=SAVE.zampa[o.index]||0;Q.err=0;Q.rErr=0;Q.prove=null;Q.round=0;Q.wt=0;Q.busy=true;
      o.reset&&o.reset();hud();setProg('');openDialog(o.who,o.intro(),()=>startRound(0));},
    update(dt){Q.wt+=dt;const ts=Q.timers;Q.timers=[];ts.forEach(t=>{t.t-=dt;if(t.t<=0)t.fn();else Q.timers.push(t);});o.update(dt);},
    draw:c=>o.draw(c),key,
    kbOpts(){const p=cur();if(!p||Q.busy||p.done)return {};
      const glow=p.err>0?1:Math.max(0,Math.min(1,(Q.wt-HINT_DELAY[Q.zampa])/.4));return {target:p.keys[p.pos],glow};}
  };
  Q.after=after;Q.cur=cur;o.Q=Q;
  return mission;
}

const ROBOT_COL=['#cfd3e0','#8fc8ff','#ffd36a','#a8e08f','#f9b4c8'];
const HINT=[0,2.5,5];              /* dopo quanti secondi brilla il tasto, per ogni zampa */
const robotSVG=on=>`<svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 6V3" stroke="#3b2a35" stroke-width="1.6"/><circle cx="13" cy="2.6" r="2" fill="${on?'#e5533d':'#cbbf9f'}"/><rect x="7" y="6" width="12" height="8" rx="2.5" fill="${on?'#8fc8ff':'#e4d6b8'}" stroke="#3b2a35" stroke-width="1.5"/><circle cx="11" cy="10" r="1.2" fill="${on?'#2b2a33':'#cbbf9f'}"/><circle cx="15" cy="10" r="1.2" fill="${on?'#2b2a33':'#cbbf9f'}"/><rect x="6" y="14.5" width="14" height="8" rx="2.5" fill="${on?'#8fc8ff':'#e4d6b8'}" stroke="#3b2a35" stroke-width="1.5"/><circle cx="9" cy="24" r="1.8" fill="#3b2a35"/><circle cx="17" cy="24" r="1.8" fill="#3b2a35"/></svg>`;
let S,timers=[];
const after=(sec,fn)=>timers.push({t:sec,fn});

/* tre ondate: le vocali, ancora le vocali mescolate, poi quattro robottini che scrivono MIAO */
function vocali6(){const v=[...'AEIOU'],out=[];while(out.length<6){const k=v[Math.floor(Math.random()*5)];if(k!=out[out.length-1])out.push(k);}return out;}
const ROUNDS=[()=>({letters:shuffle([...'AEIOU'])}),()=>({letters:vocali6()}),()=>({letters:[...'MIAO'],word:true})];

function startRound(i){
  S.round=i;S.rErr=0;const r=ROUNDS[i]();S.word=r.word?'':null;S.total=r.letters.length;S.doneN=0;
  S.queue=r.letters.map((l,k)=>({l,k,col:ROBOT_COL[k%ROBOT_COL.length],phase:'idle',t:0,x:HOME.x,y:HOME.y,s:.2,err:0,no:0}));
  if(r.word){const n=S.queue.length;S.queue.forEach((m,k)=>{m.tx=500+(k-(n-1)/2)*130;m.ty=DESK;m.ts=1.45;m.delay=k*.35;m.phase='out';m.t=-m.delay;});}
  else nextRobot();
  hud();
}
function nextRobot(){const m=S.queue.find(m=>m.phase=='idle');if(!m)return;m.tx=500;m.ty=DESK;m.ts=1.9;m.phase='out';m.t=0;}
const current=()=>S.queue&&S.queue.find(m=>m.phase=='wait'||m.phase=='out');
function hud(){
  setQuest(S.round==2?'SCRIVI LA PAROLA DEI ROBOTTINI':'PREMI LA LETTERA DEL ROBOTTINO',ZAMPE[S.zampa]);
  setProg(S.queue?S.queue.map((m,i)=>robotSVG(m.phase=='home'||m.phase=='gone')).join(''):'');
}

function key(id){
  const m=current();if(!m||m.phase!='wait'||S.busy)return;
  if(id==m.l){
    segna(m.l,true);sayKey(m.l);sfx.ok();sfx.zap();
    m.phase='home';m.t=0;m.fx=m.x;m.fy=m.y;m.fs=m.s;S.hop=1;S.wave=1.2;
    const kc=keyCenter(id);burst(kc.x,kc.y,18,['#ffd23d','#fff',DITA[DITO_DI[id]]]);
    if(S.word!=null)S.word+=m.l;else S.flash={txt:m.l,t:1.4};
    if(m.err==0&&Math.random()<.4)floatText(m.x,m.y-200,['SÌ!','EVVIVA!','BRAVISSIM'+(SAVE.cur=='piumi'?'A!':'O!')][Math.floor(Math.random()*3)],'#ffd23d');
    hud();
  }else{
    if(KEYS[id])KEYS[id].shake=1;sfx.boop();m.err++;m.no=1;S.rErr++;S.err++;segna(m.l,false);
    if(m.err==2){floatText(CATP.x+10,CATP.y-110,'MIAO?','#fff',30);after(.35,()=>{if(m.phase=='wait')sayKey(m.l);});}
  }
}

function endRound(){
  const r=S.round,b=`${BRAV()} ${N()}!`;
  if(r==0){
    const pages=[b];
    if(S.rErr<=1&&S.zampa<2){S.zampa++;pages.push('ADESSO IL TASTO NON BRILLA SUBITO!');}
    else if(S.rErr>=5&&S.zampa>0){S.zampa--;pages.push('CERCA IL TASTO CHE BRILLA!');}
    openDialog('simone',pages,()=>startRound(1));
  }else if(r==1){
    if(S.rErr>=5&&S.zampa>0)S.zampa--;
    openDialog('simone',[b,'GUARDA! INSIEME FANNO UNA PAROLA!'],()=>startRound(2));
  }else{
    S.flash={txt:'MIAO!',t:3};sfx.meow();after(.3,sfx.meow);floatText(CATP.x+10,CATP.y-120,'MIAO!','#ffd23d',40);
    after(1.3,()=>openDialog('simone',['IL COMPUTER HA DETTO MIAO!','I MIEI ROBOTTINI!',`GRAZIE ${N()}!`],()=>{
      sfx.win();confetti(500,200);S.finished=true;
      const stelle=S.err<=2?3:S.err<=6?2:1;
      SAVE.stelle[0]=Math.max(SAVE.stelle[0]||0,stelle);SAVE.zampa[0]=S.zampa;save();
      after(1.6,()=>showEnd(stelle,'I robottini sono tornati nel computer di zio Simone!'));
    }));
  }
}

function update(dt){
  const ts=timers;timers=[];ts.forEach(t=>{t.t-=dt;if(t.t<=0)t.fn();else timers.push(t);});
  S.hop=Math.max(0,S.hop-dt*3);S.wave=Math.max(0,S.wave-dt);
  if(S.flash){S.flash.t-=dt;if(S.flash.t<=0)S.flash=null;}
  if(!S.queue)return;
  S.queue.forEach(m=>{
    m.no=Math.max(0,m.no-dt*2);
    if(m.phase=='out'){m.t+=dt/.9;if(m.t<0)return;const t=Math.min(1,m.t),e=1-Math.pow(1-t,3);
      m.x=HOME.x+(m.tx-HOME.x)*e;m.y=HOME.y+(m.ty-HOME.y)*e-Math.sin(t*Math.PI)*90;m.s=.2+(m.ts-.2)*e;
      if(t>=1){m.phase='wait';m.wt=0;if(m===current()||S.word==null)after(.25,()=>{if(m.phase=='wait'&&m===current())sayKey(m.l);});}}
    else if(m.phase=='wait')m.wt+=dt;
    else if(m.phase=='home'){m.t+=dt/.7;const t=Math.min(1,m.t),e=t*t;
      m.x=m.fx+(HOME.x-m.fx)*e;m.y=m.fy+(HOME.y-m.fy)*e-Math.sin(t*Math.PI)*110;m.s=m.fs+(.15-m.fs)*e;
      if(t>=1){m.phase='gone';S.doneN++;burst(HOME.x,HOME.y,14,['#5cff7a','#6ab8ff','#ffc93d']);
        if(S.doneN>=S.total){S.queue=null;setProg('');after(.5,endRound);}
        else if(S.word==null)after(.3,nextRobot);
        else{const n=current();if(n&&n.phase=='wait')after(.2,()=>{if(n.phase=='wait'&&n===current())sayKey(n.l);});}}}
  });
}

/* ---------- disegno ---------- */
function drawRoom(c){
  c.fillStyle='#dfe9f2';c.fillRect(-EX,-EY,LW+2*EX,DESK+EY);
  c.fillStyle='#d2deea';for(let x=-Math.ceil(EX/36)*36;x<LW+EX;x+=36)c.fillRect(x,-EY,12,DESK+EY);
  /* finestra con le stelle, come nello studio di Maci e Piumi */
  const x=40,y=40,w=170,h=120;rr(c,x,y,w,h,6);fs(c,'#fff');c.save();rr(c,x+8,y+8,w-16,h-16,3);c.clip();c.fillStyle='#1f2a5a';c.fillRect(x,y,w,h);
  [[62,60],[110,80],[160,56],[90,128],[176,120],[140,140]].forEach(([a,b],i)=>{const tw=RM?1:.6+.4*Math.sin(T*3+i);C(c,a,b,1.8*tw+.6);c.fillStyle='#fff7b0';c.fill();});
  C(c,170,82,14);c.fillStyle='#fff3c4';c.fill();C(c,163,77,12);c.fillStyle='#1f2a5a';c.fill();
  c.restore();c.strokeStyle='#fff';c.lineWidth=6;c.beginPath();c.moveTo(x+w/2,y+6);c.lineTo(x+w/2,y+h-6);c.stroke();rr(c,x,y,w,h,6);c.lineWidth=3;c.strokeStyle=OL;c.stroke();
  /* armadio dei server con le lucine */
  const rx=730,ry=60;rr(c,rx,ry,60,DESK-ry,6);fs(c,'#2b2a33');
  for(let i=0;i<8;i++){const yy=ry+10+i*34;rr(c,rx+6,yy,48,26,3);fs(c,'#3d3c48',1.6);
    for(let j=0;j<3;j++){const on=RM?(i+j)%2:Math.sin(T*(3+i)+j*2.1+i)>0;C(c,rx+15+j*10,yy+13,3);c.fillStyle=on?['#5cff7a','#ffc93d','#6ab8ff'][j]:'#4a4954';c.fill();}}
}
function drawDesk(c){rr(c,-EX-10,DESK-12,LW+2*EX+20,26,6);fs(c,'#e9edf2');c.fillStyle='#c4ccd6';c.fillRect(-EX,DESK+14,LW+2*EX,420-DESK-14);
  c.strokeStyle=OL;c.lineWidth=3;c.beginPath();c.moveTo(-EX,DESK+14);c.lineTo(LW+EX,DESK+14);c.stroke();
  /* tazza di zio Simone */
  rr(c,640,DESK-48,30,36,6);fs(c,'#fff',2.5);c.fillStyle='#e5533d';c.fillRect(640,DESK-38,30,5);c.beginPath();c.arc(672,DESK-30,8,-1.3,1.3);c.lineWidth=4;c.strokeStyle=OL;c.stroke();}
function drawMonitor(c){
  const {x,y,w,h}=MON;
  rr(c,x+w/2-20,y+h-4,40,DESK-12-(y+h-4),4);fs(c,'#5a6270');
  rr(c,x,y,w,h,16);fs(c,'#2b2a33',3.5);
  c.save();rr(c,x+16,y+16,w-32,h-32,8);c.clip();c.fillStyle='#14202e';c.fillRect(x,y,w,h);
  const showWord=S.word!=null&&S.queue,txt=S.flash?S.flash.txt:showWord?S.word+'_'.repeat(Math.max(0,S.total-S.word.length)):null;
  if(txt){const sz=txt.length>2?72:120,pop=S.flash&&!RM?1+.1*Math.sin(S.flash.t*12):1;
    c.save();c.translate(x+w/2,showWord&&!S.flash?y+72:y+h/2+6);c.scale(pop,pop);bigText(c,txt,0,0,sz,'#ffd23d');c.restore();}
  else{const cols=['#7fe08a','#ffc93d','#6ab8ff','#f28cb0','#fff'];
    for(let i=0;i<11;i++){const ly=y+30+i*17,off=(i*29)%60,len=40+((i*53)%120);c.fillStyle=cols[i%cols.length];c.globalAlpha=.75;c.fillRect(x+30+off,ly,len,7);}
    c.globalAlpha=1;if(!RM&&(T*2|0)%2){c.fillStyle='#fff';c.fillRect(x+30,y+h-40,14,10);}}
  c.restore();
  C(c,x+w-26,y+h-10,4);c.fillStyle='#5cff7a';c.fill();
}
function drawRobot(c,m){
  if(m.phase=='idle'||m.phase=='gone'||m.t<0)return;
  c.save();c.translate(m.x,m.y);c.scale(m.s,m.s);
  if(m.phase=='home'&&!RM)c.rotate(m.t*TAU);
  robot(c,{x:0,y:0,k:m.k,col:m.col,run:m.phase!='wait'});
  if(m.phase!='home'){
    const cur=m===current()&&m.phase=='wait',sw=m.no&&!RM?Math.sin(m.no*30)*.25*m.no:0;
    c.save();c.translate(0,-56);c.rotate(sw);
    c.beginPath();c.moveTo(0,0);c.lineTo(0,-16);c.strokeStyle=OL;c.lineWidth=3;c.stroke();
    rr(c,-30,-76,60,60,12);fs(c,cur?'#fff':'#f3ece2',3);
    bigText(c,m.l,0,-45,46,cur?'#e5533d':'#b9aea0');
    c.restore();
    if(cur&&S.word!=null&&!RM){const b=Math.sin(T*6)*4;c.beginPath();c.moveTo(-10,-150+b);c.lineTo(10,-150+b);c.lineTo(0,-138+b);c.closePath();fs(c,'#ffd23d',2.5);}
  }
  c.restore();
}
function draw(c){
  drawRoom(c);
  /* zio Simone sta dietro la scrivania: si vedono testa e spalle */
  c.save();c.translate(SIMP.x,SIMP.y);c.scale(SIMP.s,SIMP.s);drawPerson(c,0,0,{kind:'simone',t:T,wave:S.wave>0,noShadow:true});c.restore();
  drawDesk(c);drawMonitor(c);
  drawCat(c,CATP.x,CATP.y-Math.sin(S.hop*Math.PI)*28,CATS[SAVE.cur],{sit:S.hop<.05,f:1,t:T,scale:1.7,moving:S.hop>0});
  if(S.queue)S.queue.forEach(m=>drawRobot(c,m));
}
function kbOpts(){
  const m=S.queue&&current();if(!m||m.phase!='wait')return {};
  const delay=HINT[S.zampa],glow=m.err>0?1:Math.max(0,Math.min(1,(m.wt-delay)/.4));
  return {target:m.l,glow};
}

MISSIONS.push({
  name:'Il computer di zio Simone',sub:'A E I O U',who:'simone',ready:true,music:'audio/m1.mp3',
  start(){
    timers=[];S={zampa:SAVE.zampa[0]||0,err:0,rErr:0,hop:0,wave:0,flash:null,queue:null,word:null,round:-1,finished:false};
    hud();setProg('');
    openDialog('simone',[`CIAO ${N()}!`,'I MIEI ROBOTTINI SONO SCAPPATI!','SONO USCITI DAL COMPUTER.','OGNI ROBOTTINO HA UNA LETTERA.','PREMI LA STESSA LETTERA SULLA TASTIERA!','COSÌ IL ROBOTTINO TORNA A CASA.'],()=>startRound(0));
  },
  update,draw,key,kbOpts
});
})();

/* ===== Missione 2: i libri di nonna Luisa (le consonanti: M come MELA) ===== */
(()=>{
const SHELF={x:330,y:26,w:340,h:292};
const BOOK={x:500,y:212};          /* il libro aperto davanti alla libreria */
const LUISA={x:880,y:420,s:1.5};
const COLS=['#e5533d','#4f8fd8','#5cbf60','#ffc93d','#b46ee0','#ff9a3d','#2f6f8f','#f28cb0'];
const bookSVG=on=>`<svg viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="4" width="16" height="19" rx="2" fill="${on?'#4f8fd8':'#e4d6b8'}" stroke="#3b2a35" stroke-width="1.6"/><path d="M8 4v19" stroke="#3b2a35" stroke-width="1.4"/><path d="M11 9h7M11 13h7" stroke="${on?'#fff':'#cbbf9f'}" stroke-width="1.6" stroke-linecap="round"/></svg>`;
let S={};

function rounds(){
  const a=shuffle([...'MPLT']),b=shuffle([...shuffle([...'SNRD']),...a.slice(0,2)]);
  return [()=>a.map(l=>({keys:l,col:COLS[Math.floor(Math.random()*COLS.length)]})),
          ()=>b.map(l=>({keys:l,col:COLS[Math.floor(Math.random()*COLS.length)]})),
          ()=>[{keys:'NONNA',col:'#e5533d',word:true}]];
}
const R3=rounds();
const o={
  index:1,who:'luisa',name:'I libri di nonna Luisa',sub:'LE LETTERE',music:'audio/m2.mp3',
  rounds:[()=>R3[0](),()=>R3[1](),()=>R3[2]()],
  reset(){const r=rounds();R3.splice(0,3,...r);S={book:null,shelf:[],hop:0,wave:0};},
  intro:()=>[`CIAO ${N()}!`,'SONO CADUTI TUTTI I MIEI LIBRI!','OGNI LIBRO HA UNA LETTERA.','PREMI LA LETTERA E IL LIBRO TORNA A POSTO.'],
  between:r=>r==1?['ADESSO SCRIVI NONNA!']:[],
  ending:()=>['TUTTI I LIBRI SONO A POSTO!',`GRAZIE ${N()}!`],
  endText:'I libri di nonna Luisa sono tutti a posto!',
  quest:r=>r==2?'SCRIVI LA PAROLA NONNA':'PREMI LA LETTERA DEL LIBRO',
  icon:bookSVG,
  show(p){S.book={p,t:0,phase:'in',no:0};return .8;},
  prompt(p){p.word?sayWord('nonna'):sayWord(NOME[p.keys]+' come '+FIGURE[p.keys]);},
  step(p,i,id){sayKey(id);const kc=keyCenter(id);burst(kc.x,kc.y,10,['#ffd23d','#fff']);},

    if(p.word){sayWord('nonna');confetti(BOOK.x,BOOK.y);floatText(BOOK.x,BOOK.y-120,'NONNA!','#ffd23d',46);return 1.8;}
    sayWord(NOME[p.keys]+' come '+FIGURE[p.keys]);
    if(p.err==0&&Math.random()<.4)floatText(BOOK.x,BOOK.y-110,['SÌ!','EVVIVA!','BRAVISSIM'+(SAVE.cur=='piumi'?'A!':'O!')][Math.floor(Math.random()*3)],'#ffd23d');
    return 1.1;},
  bad(){if(S.book)S.book.no=1;},
  help(p){o.prompt(p);},
  update(dt){S.hop=Math.max(0,S.hop-dt*3);S.wave=Math.max(0,S.wave-dt);
    const b=S.book;if(!b)return;b.t+=dt;b.no=Math.max(0,b.no-dt*2);
    if(b.phase=='out'&&b.t>=.8){S.shelf.push({col:b.p.col,l:b.p.word?'♥':b.p.keys});S.book=null;sfx.tic();}},
  draw(c){
    /* il salotto dei nonni */
    c.fillStyle='#f6e3c8';c.fillRect(-EX,-EY,LW+2*EX,330+EY);
    c.fillStyle='#efd3ae';for(let y=20;y<330;y+=46)for(let x=-Math.ceil(EX/46)*46+(y/46%2)*23;x<LW+EX;x+=46){C(c,x,y,4);c.fill();}
    c.fillStyle='#c99a6b';c.fillRect(-EX,330,LW+2*EX,90);c.strokeStyle='#b88a5c';c.lineWidth=2;for(let x=-EX;x<LW+EX;x+=70){c.beginPath();c.moveTo(x,330);c.lineTo(x-30,420);c.stroke();}

function drawShelf(c){

})();

/* ===== Missione 3: i gomitoli di Emma (le sillabe: MA ME MI MO MU, poi le parole) ===== */
(()=>{
const BALL={x:470,y:235,r:66};
const EMMA={x:860,y:345,s:2.3};
const BASKET={x:735,y:372};
const YARN=['#e5533d','#4f8fd8','#5cbf60','#ffc93d','#b46ee0','#ff9a3d','#f28cb0','#2f9fa0'];
const PAROLE3=[['ME','LA','mela'],['LU','NA','luna'],['SO','LE','sole']];
const yarnSVG=on=>`<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="9" fill="${on?'#f28cb0':'#e4d6b8'}" stroke="#3b2a35" stroke-width="1.6"/><path d="M7 9c4 2 8 2 12 0M6 14c5 2 9 2 14 0M8 19c3 1 7 1 10 0" fill="none" stroke="${on?'#fff':'#cbbf9f'}" stroke-width="1.4"/><path d="M21 17c2 2 2 5 0 6" fill="none" stroke="#3b2a35" stroke-width="1.4"/></svg>`;
let S={};
const col=()=>YARN[Math.floor(Math.random()*YARN.length)];
const sill=(c,v)=>({keys:c+v,parts:[c+v],say:(c+v).toLowerCase(),col:col()});

const o={
  index:2,who:'emma',name:'I gomitoli di Emma',sub:'LE SILLABE',music:'audio/m3.mp3',
  rounds:[
    ()=>shuffle([...'AEIOU']).map(v=>sill('M',v)),
    ()=>shuffle([...'PLTNS']).map(c=>sill(c,'AEIOU'[Math.floor(Math.random()*5)])),
    ()=>shuffle(PAROLE3).map(([a,b,w])=>({keys:a+b,parts:[a,b],say:w,word:true,col:col()}))
  ],
  reset(){S={ball:null,scarf:[],hop:0};},
  intro:()=>[`CIAO ${N()}!`,'FACCIO UNA SCIARPA PER MARGHERITA.','OGNI GOMITOLO HA UNA SILLABA.','SCRIVI LA SILLABA CON DUE TASTI!'],
  between:r=>r==1?['ADESSO LE PAROLE!']:[],
  ending:()=>['LA SCIARPA È PRONTA!',`GRAZIE ${N()}!`],
  endText:'Emma ha finito la sciarpa per Margherita!',
  quest:r=>r==2?'SCRIVI LA PAROLA':'SCRIVI LA SILLABA DEL GOMITOLO',
  icon:yarnSVG,
  show(p){S.ball={p,t:0,phase:'in',no:0,rot:0};return 1;},
  prompt(p){if(p.word)sayList([p.say,...p.parts.map(s=>s.toLowerCase())],900);else sayWord(p.say);},
  step(p,i,id){const kc=keyCenter(id);burst(kc.x,kc.y,10,['#ffd23d','#fff']);
    if(p.word&&i==2)sayWord(p.parts[0].toLowerCase());},
  good(p){const b=S.ball;b.phase='out';b.t=0;S.hop=1;
    const kc=keyCenter(p.keys[p.keys.length-1]);burst(kc.x,kc.y,16,['#ffd23d','#fff',p.col]);
    sayWord(p.say);if(p.err==0&&Math.random()<.4)floatText(BALL.x,BALL.y-120,BRAVI(),'#ffd23d');
    if(p.word){floatText(BALL.x,BALL.y-130,p.keys+'!','#ffd23d',46);return 1.7;}
    return 1.2;},
  bad(){if(S.ball)S.ball.no=1;},
  help(p){o.prompt(p);},
  update(dt){S.hop=Math.max(0,S.hop-dt*3);const b=S.ball;if(!b)return;b.t+=dt;b.no=Math.max(0,b.no-dt*2);
    if(b.phase=='out'&&b.t>=.9){S.scarf.push(b.p.col);S.ball=null;sfx.tic();}},
  draw(c){
    /* la stanza di Emma: carta da parati a righe, poltrona, cesto della lana */
    c.fillStyle='#fbe3e8';c.fillRect(-EX,-EY,LW+2*EX,330+EY);
    c.fillStyle='#f6d2da';for(let x=-Math.ceil(EX/50)*50;x<LW+EX;x+=50)c.fillRect(x,-EY,22,330+EY);
    /* quadro con una margherita */
    rr(c,90,60,120,96,6);fs(c,'#c98b55');rr(c,102,72,96,72,3);c.fillStyle='#bfe3a5';c.fill();daisy(c,150,108,22,T*.2);
    c.fillStyle='#c99a6b';c.fillRect(-EX,330,LW+2*EX,90);c.strokeStyle=OL;c.lineWidth=3;c.beginPath();c.moveTo(-EX,330);c.lineTo(LW+EX,330);c.stroke();
    /* poltrona */
    rr(c,770,200,190,150,40);fs(c,'#6a8ff0');rr(c,760,280,40,90,18);fs(c,'#5a7fd8');rr(c,930,280,40,90,18);fs(c,'#5a7fd8');rr(c,790,300,150,50,14);fs(c,'#7f9ff4');
    drawCat(c,EMMA.x,EMMA.y,CATS.emma,{sit:true,f:-1,t:T,scale:EMMA.s});
    /* ferri da maglia */
    c.strokeStyle=OL;c.lineWidth=5;c.beginPath();c.moveTo(800,270);c.lineTo(840,300);c.moveTo(842,262);c.lineTo(812,304);c.stroke();
    c.strokeStyle='#d9d9e0';c.lineWidth=2.5;c.stroke();
    drawScarf(c);
    cesto(c,BASKET.x,BASKET.y,90,false);[['#5cbf60',-18],['#ffc93d',4],['#e5533d',20]].forEach(([k,d])=>gomitolo(c,BASKET.x+d,BASKET.y-12,15,k,d));cesto(c,BASKET.x,BASKET.y,90,true);
    drawQCat(c,S.hop);
    if(S.ball)drawBall(c,S.ball);
  }
};
/* la sciarpa scende dai ferri e corre sul pavimento: una riga per ogni sillaba */
function drawScarf(c){
  const n=S.scarf.length;if(!n)return;
  S.scarf.forEach((k,i)=>{const x=812-i*24,y=i==0?318:352;
    if(i==0){rr(c,800,300,24,44,4);fs(c,k,2.4);}
    else{rr(c,x,340,24,26,4);fs(c,k,2.4);c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;c.beginPath();c.moveTo(x+6,346);c.lineTo(x+6,360);c.moveTo(x+14,346);c.lineTo(x+14,360);c.stroke();}});
  /* le frange alla fine */
  if(n>1){const x=812-(n-1)*24;c.strokeStyle=S.scarf[n-1];c.lineWidth=3;for(let k=0;k<4;k++){c.beginPath();c.moveTo(x,344+k*6);c.lineTo(x-10,346+k*6);c.stroke();}}
}
function drawBall(c,b){
  const p=b.p;let x=BALL.x,y=BALL.y,s=1,rot=0;
  if(b.phase=='in'){const t=Math.min(1,b.t/.9),e=1-Math.pow(1-t,3);x=-80+(BALL.x+80)*e;rot=(e-1)*6;y=BALL.y-Math.abs(Math.sin(t*Math.PI*2))*30*(1-t);}
  else{const t=Math.min(1,b.t/.9);x=BALL.x+(BASKET.x-BALL.x)*t;y=BALL.y+(BASKET.y-30-BALL.y)*t-Math.sin(t*Math.PI)*90;s=1-.75*t;rot=t*6;}
  const sw=b.no&&!RM?Math.sin(b.no*30)*12*b.no:0;
  if(p.word)drawIcon(c,p.say,x,y-BALL.r-62,1.1);
  /* il filo che resta indietro */
  c.beginPath();c.moveTo(x-BALL.r*s*.6,y+BALL.r*s*.7);c.quadraticCurveTo(x-120,y+90,x-200,y+100);c.strokeStyle=p.col;c.lineWidth=3;c.stroke();
  gomitolo(c,x+sw,y,BALL.r*s,p.col,rot);
  if(b.phase=='out')return;
  /* la sillaba: le lettere già scritte diventano gialle; nelle parole un puntino divide le sillabe */
  /* il cartellino: lettere già scritte rosse, la prossima gialla, le altre grigie (come i libri di nonna Luisa) */
  const txt=p.word?p.parts.join('·'):p.keys,size=p.word?50:72,w=size*.66,tw=txt.length*w+30;let k=0;
  rr(c,x+sw-tw/2,y-size*.62,tw,size*1.25,16);fs(c,'#fffaf0',3);
  [...txt].forEach((ch,i)=>{const cx=x+sw+(i-(txt.length-1)/2)*w;
    if(ch=='·'){bigText(c,'·',cx,y+4,size,'#b9aea0');return;}
    bigText(c,ch,cx,y+4,size,k<p.pos?'#e5533d':k==p.pos?'#ffd23d':'#d9cfbf');k++;});
}
MISSIONS.push(makeQuiz(o));
})();

/* ===== Missione 4: l'orto di zio Giulio (contare fino a 9) ===== */
(()=>{
const GIULIO={x:885,y:425,s:1.5};
const BASKET={x:750,y:380};
const carrotSVG=on=>`<svg viewBox="0 0 26 26" aria-hidden="true"><path d="M9 9l11 2-9 12z" fill="${on?'#ff8a2a':'#e4d6b8'}" stroke="#3b2a35" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 9L6 3M11 8l1-6M12 9l5-5" stroke="${on?'#3f9a48':'#cbbf9f'}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
let S={};
/* dove spuntano gli ortaggi: una fila fino a 5, due file oltre */
function spots(n){const rows=n<=5?[n]:[Math.ceil(n/2),Math.floor(n/2)],out=[];
  rows.forEach((m,r)=>{for(let i=0;i<m;i++)out.push({x:480+(i-(m-1)/2)*92,y:rows.length==1?285:248+r*72});});return out;}
function pick(from,n){return shuffle(from).slice(0,n);}
const prova=(n,veg)=>({n,keys:String(n),veg});

function pomodoro(c,x,y,s){c.save();c.translate(x,y);c.scale(s,s);C(c,0,0,16);fs(c,'#e5533d',2.4);E(c,-6,-5,4,3,-.5);c.fillStyle='rgba(255,255,255,.5)';c.fill();
  c.fillStyle='#3f9a48';for(let i=0;i<5;i++){c.save();c.rotate(i*TAU/5);E(c,0,-14,3,7);c.fill();c.restore();}c.restore();}
function plant(c,v){
  const pop=Math.min(1,v.t*5),s=(RM?1:pop*(1+.2*Math.max(0,1-v.t*4)));
  if(s<=0)return;
  const hl=v.hl>0,wig=(v.no&&!RM?Math.sin(v.no*30)*.2*v.no:0)+(hl&&!RM?Math.sin(v.hl*20)*.1:0);
  c.save();c.translate(v.x,v.y);c.rotate(wig);c.scale(s*1.6,s*1.6);
  if(hl){c.save();c.shadowColor='#ffd23d';c.shadowBlur=24;C(c,0,-10,30);c.fillStyle='rgba(255,230,120,.7)';c.fill();c.restore();}
  if(v.veg=='carota'){E(c,0,4,22,7);c.fillStyle='#6f4127';c.fill();carrotTop(c,0,0,true);}
  else{rr(c,-2,-40,4,42,2);c.fillStyle='#3f9a48';c.fill();E(c,-10,-26,9,4,-.4);E(c,10,-34,9,4,.4);c.fillStyle='#4caf50';c.fill();pomodoro(c,0,-10,1.1);}
  c.restore();
  if(v.num)bigText(c,String(v.num),v.x,v.y-84,38,'#fff');
}
const o={
  index:3,who:'giulio',name:"L'orto di zio Giulio",sub:'CONTARE',music:'audio/m4.mp3',
  rounds:[
    ()=>shuffle([1,2,3,4,5]).map(n=>prova(n,'carota')),
    ()=>pick([3,4,5,6,7,8,9],5).map(n=>prova(n,'carota')),
    ()=>pick([4,5,6,7,8,9],4).map(n=>prova(n,'pomodoro'))
  ],
  reset(){S={veg:[],flying:[],basket:[],hop:0,wave:0,first:true};},
  intro:()=>[`CIAO ${N()}!`,'RACCOGLIAMO LE CAROTE!','CONTA LE CAROTE.','PREMI IL NUMERO GIUSTO!'],
  between:r=>r==1?['ADESSO I POMODORI!']:[],
  ending:()=>['CHE BEL CESTO!',`GRAZIE ${N()}!`],
  endText:'Il cesto di zio Giulio è pieno di carote e pomodori!',
  quest:r=>r==2?'QUANTI POMODORI? PREMI IL NUMERO':'QUANTE CAROTE? PREMI IL NUMERO',
  icon:carrotSVG,
  show(p){S.veg=spots(p.n).map((s,i)=>({...s,veg:p.veg,t:-i*.14,hl:0,no:0,num:0}));return .5+p.n*.14;},
  prompt(p){say(p.veg=='carota'?'QUANTE CAROTE?':'QUANTI POMODORI?','giulio');},
  step(){},
  /* giusto: si contano a voce mentre saltano nel cesto */
  good(p){S.hop=1;S.wave=1.5;const kc=keyCenter(p.keys);burst(kc.x,kc.y,16,['#ffd23d','#fff','#ff8a2a']);
    S.veg.forEach((v,i)=>o.Q.after(.35+i*.6,()=>{v.num=i+1;sayWord(NOME[i+1]);
      o.Q.after(.3,()=>{S.flying.push({x:v.x,y:v.y-10,veg:v.veg,t:0,fx:v.x,fy:v.y-10});v.gone=true;});}));
    o.Q.after(.35+p.n*.6+.3,()=>{floatText(480,150,String(p.n)+'!','#ffd23d',70);if(p.err==0&&Math.random()<.5)floatText(480,90,BRAVI(),'#fff');});
    return .35+p.n*.6+1.2;},
  bad(p){S.veg.forEach(v=>v.no=1);},
  /* dopo due errori zio Giulio li conta insieme, uno alla volta (senza raccoglierli) */
  help(p){S.veg.forEach((v,i)=>o.Q.after(i*.7,()=>{v.hl=.6;sayWord(NOME[i+1]);}));},
  update(dt){S.hop=Math.max(0,S.hop-dt*3);S.wave=Math.max(0,S.wave-dt);
    S.veg.forEach(v=>{v.t+=dt;v.hl=Math.max(0,v.hl-dt);v.no=Math.max(0,v.no-dt*2);});
    S.flying.forEach(f=>{f.t+=dt/.55;const t=Math.min(1,f.t);f.x=f.fx+(BASKET.x-f.fx)*t;f.y=f.fy+(BASKET.y-20-f.fy)*t-Math.sin(t*Math.PI)*120;});
    S.flying.forEach(f=>{if(f.t>=1)S.basket.push(f.veg);});S.flying=S.flying.filter(f=>f.t<1);
    S.veg=S.veg.filter(v=>!v.gone);},
  draw(c){
    /* cielo, colline, orto con la staccionata */
    c.fillStyle='#bfe6ff';c.fillRect(-EX,-EY,LW+2*EX,230+EY);
    drawIcon(c,'sole',140,80,1.1);
    [[150,230,260,'#8fd36a'],[560,230,330,'#7cc65a'],[960,230,260,'#8fd36a']].forEach(([x,y,r,k])=>{E(c,x,y,r,70);c.fillStyle=k;c.fill();});
    c.fillStyle='#8a5a36';c.fillRect(-EX,210,LW+2*EX,130);
    c.strokeStyle='#74482c';c.lineWidth=3;for(let y=232;y<336;y+=26){c.beginPath();c.moveTo(-EX,y);c.lineTo(LW+EX,y);c.stroke();}
    c.fillStyle='#6aa94b';c.fillRect(-EX,330,LW+2*EX,90);c.strokeStyle=OL;c.lineWidth=3;c.beginPath();c.moveTo(-EX,330);c.lineTo(LW+EX,330);c.stroke();
    c.beginPath();c.moveTo(-EX,208);c.lineTo(LW+EX,208);c.strokeStyle=OL;c.lineWidth=8;c.stroke();c.strokeStyle='#e8d2a8';c.lineWidth=4;c.stroke();
    for(let px=-Math.ceil(EX/40)*40;px<=LW+EX;px+=40){c.beginPath();c.moveTo(px-5,214);c.lineTo(px-5,190);c.lineTo(px,184);c.lineTo(px+5,190);c.lineTo(px+5,214);c.closePath();fs(c,'#f7ead0',2.2);}
    c.save();c.translate(GIULIO.x,GIULIO.y);c.scale(GIULIO.s,GIULIO.s);drawPerson(c,0,0,{kind:'giulio',t:T,wave:S.wave>0});c.restore();
    cesto(c,BASKET.x,BASKET.y,110,false);
    S.basket.slice(-12).forEach((v,i)=>{const a=(i%6)/5-.5,row=Math.floor(i/6);v=='carota'?carrot(c,BASKET.x+a*70,BASKET.y-30-row*8,a*.8):pomodoro(c,BASKET.x+a*70,BASKET.y-24-row*8,.7);});
    cesto(c,BASKET.x,BASKET.y,110,true);
    drawQCat(c,S.hop);
    S.veg.forEach(v=>plant(c,v));
    S.flying.forEach(f=>f.veg=='carota'?(c.save(),c.translate(f.x,f.y),c.scale(2,2),carrot(c,0,0,f.t*8),c.restore()):pomodoro(c,f.x,f.y,1.2));
  }
};
MISSIONS.push(makeQuiz(o));
})();

/* ===== Missione 5: il pollaio di zia Mile (le addizioni fino a 9: 2 + 3 = ?) ===== */
(()=>{
const MILE={x:885,y:425,s:1.5};
const NESTS=[{x:350,y:330},{x:610,y:330}];
const BOARD={x:540,y:112,w:310,h:116};
const eggSVG=on=>`<svg viewBox="0 0 26 26" aria-hidden="true"><ellipse cx="13" cy="14" rx="8" ry="10" fill="${on?'#fff8ec':'#e4d6b8'}" stroke="#3b2a35" stroke-width="1.6"/><ellipse cx="10" cy="10" rx="2" ry="3" fill="${on?'#fff':'#efe5cf'}"/></svg>`;
let S={};
/* posti delle uova dentro il nido: fino a 5 */
const EGG_POS=[[-42,0],[0,0],[42,0],[-21,-44],[21,-44]];
function sums(lo,hi,maxA,maxB,n){const all=[];for(let a=1;a<=maxA;a++)for(let b=1;b<=maxB;b++)if(a+b>=lo&&a+b<=hi)all.push([a,b]);return shuffle(all).slice(0,n).map(([a,b])=>({a,b,keys:String(a+b)}));}

function nest(c,x,y){E(c,x,y,64,20);fs(c,'#e8c66a',2.6);c.strokeStyle='#c9a24a';c.lineWidth=1.8;for(let k=-50;k<=50;k+=10){c.beginPath();c.moveTo(x+k-5,y-10);c.lineTo(x+k+5,y+8);c.stroke();}}
const o={
  index:4,who:'mile',name:'Il pollaio di zia Mile',sub:'PIÙ',music:'audio/m5.mp3',
  rounds:[()=>sums(2,5,3,2,5),()=>sums(3,7,4,3,5),()=>sums(6,9,5,4,5)],
  reset(){S={eggs:[],hop:0,wave:0,hen:0,res:null,pi:0,p:null};},
  intro:()=>[`CIAO ${N()}!`,'LE GALLINE FANNO LE UOVA.','CONTA TUTTE LE UOVA!','QUANTE UOVA IN TUTTO?'],
  between:r=>r==1?['ADESSO TANTE UOVA!']:[],
  ending:()=>['CHE BELLE UOVA!','FACCIAMO LA FRITTATA.',`GRAZIE ${N()}!`],
  endText:'Zia Mile fa una frittata gigante con tutte le uova!',
  quest:()=>'QUANTE UOVA IN TUTTO? PREMI IL NUMERO',
  icon:eggSVG,
  show(p){S.p=p;S.res=null;S.eggs=[];
    for(let i=0;i<p.a;i++)S.eggs.push({n:0,i,t:-i*.15,hl:0});
    for(let i=0;i<p.b;i++)S.eggs.push({n:1,i,t:-(p.a*.15+.5+i*.35),hl:0,laid:true});
    o.Q.after(p.a*.15+.4,()=>{S.hen=p.b*.35+.3;});
    return p.a*.15+.6+p.b*.35;},
  prompt(p){sayList([NOME[p.a],'più',NOME[p.b]],750);},
  step(){},
  /* giusto: si contano tutte le uova, una alla volta */
  good(p){S.hop=1;S.wave=1.6;const kc=keyCenter(p.keys);burst(kc.x,kc.y,16,['#ffd23d','#fff']);
    S.eggs.forEach((e,i)=>o.Q.after(i*.5,()=>{e.hl=.7;e.num=i+1;sayWord(NOME[i+1]);}));
    const sum=p.a+p.b;o.Q.after(sum*.5+.2,()=>{S.res=sum;sayList(['fa',NOME[sum]],600);floatText(BOARD.x,BOARD.y-60,p.err==0&&Math.random()<.5?BRAVI():'',"#ffd23d");});
    return sum*.5+1.8;},
  bad(){S.eggs.forEach(e=>e.no=1);},
  help(p){S.eggs.forEach((e,i)=>o.Q.after(i*.7,()=>{e.hl=.6;sayWord(NOME[i+1]);}));},
  update(dt){S.hop=Math.max(0,S.hop-dt*3);S.wave=Math.max(0,S.wave-dt);S.hen=Math.max(0,S.hen-dt);
    S.eggs.forEach(e=>{const was=e.t;e.t+=dt;e.hl=Math.max(0,e.hl-dt);e.no=Math.max(0,(e.no||0)-dt*2);if(e.laid&&was<0&&e.t>=0)sfx.tic();});},
  draw(c){
    /* aia: cielo, prato, pollaio */
    c.fillStyle='#cdeeff';c.fillRect(-EX,-EY,LW+2*EX,250+EY);
    [[90,70],[700,50]].forEach(([x,y])=>drawIcon(c,'nuvola',x,y,1.3));
    c.fillStyle='#8fd36a';c.fillRect(-EX,250,LW+2*EX,170);c.strokeStyle='#7cc65a';c.lineWidth=3;
    for(let x=-Math.ceil(EX/37)*37;x<LW+EX;x+=37){c.beginPath();c.moveTo(x,300+(x%3)*20);c.lineTo(x+4,290+(x%3)*20);c.stroke();}
    drawCoop(c,105,300);
    c.save();c.translate(MILE.x,MILE.y);c.scale(MILE.s,MILE.s);drawPerson(c,0,0,{kind:'mile',t:T,wave:S.wave>0});c.restore();
    drawBoard(c);
    NESTS.forEach(n=>nest(c,n.x,n.y));
    /* la gallina che fa le uova nel secondo nido */
    const lay=S.hen>0&&!RM,hb=lay?Math.abs(Math.sin(T*10))*8:0;
    hen(c,NESTS[1].x+116,NESTS[1].y+4-hb,-1,['#fff4e0','#e9d6b8'],{s:2,t:T,peck:!lay,k:1});
    if(S.p)bigText(c,'+',(NESTS[0].x+NESTS[1].x)/2,NESTS[0].y-14,56,'#fff');
    S.eggs.forEach(e=>{if(e.t<0)return;const n=NESTS[e.n],[dx,dy]=EGG_POS[e.i],pop=RM?1:Math.min(1,e.t*5),
      wig=e.no&&!RM?Math.sin(e.no*30)*4*e.no:0,hy=e.laid?-Math.max(0,1-e.t*3)*50:0;
      uovo(c,n.x+dx+wig,n.y+dy-12+hy,1.3*pop,e.hl>0);
      if(e.num)bigText(c,String(e.num),n.x+dx,n.y+dy-46,26,'#fff');});
    drawQCat(c,S.hop);
  }
};
/* la lavagnetta con il conto */
function drawBoard(c){const {x,y,w,h}=BOARD;
  rr(c,x-w/2,y-h/2,w,h,10);fs(c,'#b0743f',3);rr(c,x-w/2+10,y-h/2+10,w-20,h-20,6);c.fillStyle='#2f4a3a';c.fill();
  const p=S.p;if(!p)return;
  const txt=`${p.a} + ${p.b} = ${S.res==null?'?':S.res}`;
  c.save();c.font='700 64px Fredoka, system-ui, sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillStyle=S.res==null?'#f6f1e4':'#ffd23d';c.fillText(txt,x,y+4);c.restore();}
function drawCoop(c,x,y){shadowAt(c,x,y+4,90,12);
  rr(c,x-70,y-80,140,80,4);fs(c,'#e9c27a');c.strokeStyle='#cfa25c';c.lineWidth=2;for(let k=x-56;k<x+70;k+=18){c.beginPath();c.moveTo(k,y-78);c.lineTo(k,y-2);c.stroke();}
  c.beginPath();c.moveTo(x-86,y-74);c.lineTo(x,y-124);c.lineTo(x+86,y-74);c.closePath();fs(c,'#d0623c');
  c.beginPath();c.moveTo(x-20,y);c.lineTo(x-20,y-36);c.arc(x,y-36,20,Math.PI,0);c.lineTo(x+20,y);c.closePath();fs(c,'#5a3a2a');
  hen(c,x+6,y-120,1,['#e5533d','#b0402a'],{rooster:true,t:T,s:.9});}
MISSIONS.push(makeQuiz(o));

/* ===== Avvio: schermate, tastiera vera e toccata, ciclo del gioco ===== */
const $=id=>document.getElementById(id);
const starSVG=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on?'#ffc93d':'#e4d6b8'}" stroke="#3b2a35" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

function show(scr){
  SCR=scr;document.body.classList.toggle('intro',scr=='intro');document.body.classList.toggle('play',scr=='play');
  $('start').hidden=scr!='intro';$('menu').hidden=scr!='menu';$('end').hidden=scr!='end';
}
function goIntro(){show('intro');introReset();}
function goMenu(){
  if(dlg){dlg=null;$('dlg').hidden=true;document.body.classList.remove('talking');}
  stopVoice();sayTimers.forEach(clearTimeout);M=null;show('menu');floats=[];parts=[];playMusic('audio/intro.mp3');
  $('levels').innerHTML=MISSIONS.map((m,i)=>`<button class="lvl" data-m="${i}" ${m.ready?'':'disabled'}><b>${i+1}</b><span>${m.name}<small>${m.sub}</small>${m.ready?(SAVE.stelle[i]?`<i>${'★'.repeat(SAVE.stelle[i])}</i>`:''):'<i>PRESTO!</i>'}</span></button>`).join('');
  $('levels').querySelectorAll('.lvl').forEach(b=>b.onclick=()=>play(+b.dataset.m));
}
function play(i){
  const m=MISSIONS[i];if(!m||!m.ready)return;
  M=m;M.index=i;floats=[];parts=[];show('play');sfx.motivo();playMusic(m.music);m.start();
}
function showEnd(stelle,text){
  show('end');$('stars').innerHTML=[0,1,2].map(i=>starSVG(i<stelle)).join('');$('endText').textContent=text;sfx.win();
}
$('bPlay').onclick=()=>{unlockAudio();goMenu();};
$('again').onclick=()=>play(M.index);
$('toMenu').onclick=goMenu;
$('bBack').onclick=goMenu;
$('bMus').onclick=()=>{unlockAudio();if(musicOn&&music.paused){music.play().catch(()=>{});return;}setMusic(!musicOn);};
function setCat(k){SAVE.cur=k;save();$('bMaci').classList.toggle('on',k=='maci');$('bPiumi').classList.toggle('on',k=='piumi');sfx.meow();}
$('bMaci').onclick=()=>setCat('maci');
$('bPiumi').onclick=()=>setCat('piumi');
function drawPortraits(){
  [['bMaci','maci'],['bPiumi','piumi']].forEach(([id,k])=>{const p=document.querySelector('#'+id+' canvas').getContext('2d');p.setTransform(1,0,0,1,0,0);p.clearRect(0,0,96,96);p.setTransform(1.45,0,0,1.45,0,0);drawCat(p,30,62,CATS[k],{f:1,t:0,sit:true,noShadow:true});});
}

/* ---------- un tasto premuto: dalla tastiera vera o toccando quella disegnata ---------- */
function pressKey(id){
  unlockAudio();if(KEYS[id])KEYS[id].press=1;sfx.tic();
  if(dlg){if(id=='INVIO'||id=='SPAZIO')nextPage();return;}
  if(SCR=='intro'){if(id=='INVIO')goMenu();else sayKey(id);return;}
  if(SCR=='menu'){const n=+id;if(n>=1&&n<=MISSIONS.length&&MISSIONS[n-1].ready)play(n-1);else if(id=='INVIO')play(0);else sayKey(id);return;}
  if(SCR=='end'){if(id=='INVIO')play(M.index);return;}
  if(SCR=='play'&&M)M.key(id);
}
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const id=keyId(e);if(!id)return;
  /* se un pulsante ha il fuoco (si è arrivati con TAB), INVIO e SPAZIO lo premono */
  const a=document.activeElement;
  if((id=='INVIO'||id=='SPAZIO')&&a&&a.tagName=='BUTTON'){KEYS[id].press=1;return;}
  e.preventDefault();if(e.repeat)return;pressKey(id);
});
/* dopo un tocco su un pulsante il fuoco non deve restare lì, se no INVIO lo ripremerebbe */
addEventListener('pointerup',()=>setTimeout(()=>{const a=document.activeElement;if(a&&a.tagName=='BUTTON')a.blur();}),true);
cv.addEventListener('pointerdown',e=>{const p=toLogic(e.clientX,e.clientY),k=keyAt(p.x,p.y);if(k){e.preventDefault();pressKey(k.id);}});
/* la musica dell'intro parte al primo tocco, se il browser non l'ha fatta partire da sola */
['pointerup','keydown'].forEach(ev=>addEventListener(ev,()=>{unlockAudio();if(musicOn&&music.paused&&SCR!='play')playMusic('audio/intro.mp3');},true));

/* ---------- ciclo ---------- */
function update(dt){
  kbUpdate(dt);fxUpdate(dt);
  if(SCR=='intro'||SCR=='menu')introUpdate(dt);
  else if(M&&(SCR=='play'||SCR=='end'))M.update(dt);
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#4a4252';ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*Z,0,0,DPR*Z,DPR*OX,DPR*OY);
  const inPlay=M&&(SCR=='play'||SCR=='end');
  if(inPlay)M.draw(ctx);else introDraw(ctx);
  const o=dlg?{target:'INVIO'}:SCR=='intro'&&IN.pause>0?{target:'INVIO'}:SCR=='end'?{target:'INVIO'}:inPlay&&M.kbOpts?M.kbOpts():{};
  drawKeyboard(ctx,o);
  if(!inPlay)introCat(ctx);
  fxDraw(ctx);
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;update(dt);render();requestAnimationFrame(frame);}
setCat(SAVE.cur);$('bMus').classList.toggle('on',musicOn);
drawPortraits();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawPortraits);
goIntro();music.src='audio/intro.mp3';if(musicOn)music.play().catch(()=>{});
requestAnimationFrame(frame);
if(location.hash=='#debug')window.__ttm={get SCR(){return SCR;},play,goMenu,pressKey,SAVE,step:dt=>{T+=dt;update(dt);},get target(){return M&&M.kbOpts?M.kbOpts().target:null;}};

})();
